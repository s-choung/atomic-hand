name: smoke (windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install OVITO (first, to avoid Qt conflicts)
        run: pip install ovito

      - name: Install other dependencies
        run: pip install "mediapipe==0.10.14" opencv-python PySide6 numpy

      - name: Headless smoke test (import + render + hq subprocess)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_test.py
